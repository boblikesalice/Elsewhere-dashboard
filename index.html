<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">

<title>VIE Offers</title>
<style>
  :root {
    /* deliberately fixed (not tied to prefers-color-scheme): a dark glass
       panel design needs white text to work, so it can't flip with the OS */
    color-scheme: dark;

    --text: #ffffff;
    --muted: rgba(255, 255, 255, 0.75);
    --accent: #cabdff;

    /* frosted surfaces: light glass again. Combined with white text this is
       low-contrast over the brighter (yellow) part of the background - kept
       as asked, but flagged. */
    --glass: rgba(255, 255, 255, 0.68);
    --glass-strong: rgba(255, 255, 255, 0.84);
    --glass-border: rgba(255, 255, 255, 0.88);
    --glass-shadow: 0 8px 30px rgba(64, 78, 130, 0.08);
    --glass-shadow-hover: 0 14px 38px rgba(64, 78, 130, 0.13);
    --glass-inset: inset 0 1px 0 rgba(255, 255, 255, 0.90);
    --blur: 18px;

    /* new offers */
    --new-glass: rgba(214, 250, 235, 0.28);
    --new-border: rgba(52, 211, 153, 0.55);
    --new-text: #6ee7b7;

    /* favorites */
    --fav-color: #fbbf24;

    --radius: 16px;
  }

  * { box-sizing: border-box; }

  html {
    min-height: 100%;
    min-height: 100vh;
    background-color : rgb(13, 17, 22);
    background-attachment: fixed;
    background-size: cover;
  }

  body {
    margin: 0;
    padding: 0 0 56px;
    background: transparent;
    color: var(--text);
    font: 15px/1.5 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto,
          Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
    text-shadow: 0 1px 3px rgba(0, 0, 0, 0.4);
  }

  .wrap {
    max-width: 1180px;
    margin: 0 auto;
    padding: 0 20px;
  }

  /* ---------- header ---------- */
  header {
    position: sticky;
    top: 14px;
    z-index: 10;
    width: calc(100% - 40px);
    margin: 20px auto 28px;
    padding: 20px 24px 18px;

    /* same glass family as .card, a touch more opaque: this one stays
       legible while sticky over scrolling cards behind it. */
    background: rgba(255, 255, 255, 0.4);
    border-radius: 20px;
    box-shadow: 0 8px 32px rgba(0, 0, 0, 0.12);
    -webkit-backdrop-filter: blur(10px);
    backdrop-filter: blur(10px);
    border: 1px solid rgba(255, 255, 255, 0.45);
  }

  h1 {
    margin: 0 0 4px;
    font-size: 22px;
    font-weight: 650;
    letter-spacing: -0.015em;
  }

  .updated {
    margin: 0;
    color: var(--muted);
    font-size: 13px;
  }

  .controls {
    display: flex;
    flex-wrap: wrap;
    align-items: center;
    gap: 12px;
    margin-top: 18px;
  }

  label {
    font-size: 13px;
    color: var(--muted);
  }

  select {
    font: inherit;
    font-size: 14px;
    color: #000;
    background: var(--glass);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    backdrop-filter: blur(10px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    box-shadow: var(--glass-inset);
    padding: 7px 12px;
    max-width: 100%;
  }

  select:focus-visible,
  a:focus-visible,
  button:focus-visible {
    outline: 2px solid var(--accent);
    outline-offset: 2px;
  }

  .fav-toggle {
    font: inherit;
    font-size: 13px;
    font-weight: 600;
    color: #000;
    background: var(--glass);
    -webkit-backdrop-filter: blur(10px) saturate(160%);
    backdrop-filter: blur(10px) saturate(160%);
    border: 1px solid var(--glass-border);
    border-radius: 999px;
    box-shadow: var(--glass-inset);
    padding: 7px 14px;
    cursor: pointer;
    white-space: nowrap;
  }

  .fav-toggle.is-active {
    color: #4a3400;
    background: var(--fav-color);
    border-color: var(--fav-color);
  }

  .count {
    margin-left: auto;
    font-size: 13px;
    color: var(--muted);
    white-space: nowrap;
  }

  .count strong {
    color: var(--text);
    font-weight: 600;
  }

  .count .new-count {
    color: var(--new-text);
    font-weight: 600;
  }

  /* ---------- grid ---------- */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(290px, 1fr));
    /* 1fr on the implicit rows: every row is sized on the tallest card of the
       whole grid, so all the boxes end up strictly identical in height.
       (Without it, grid only equalises cards within their own row.) */
    grid-auto-rows: 1fr;
    gap: 16px;
  }

  .card {
    display: flex;
    flex-direction: column;
    gap: 10px;
    padding: 16px 16px 14px;
    transition: transform .18s ease, box-shadow .18s ease, background-color .18s ease;

    /* From https://css.glass */
    background: rgba(255, 255, 255, 0.2);
    border-radius: 16px;
    box-shadow: 0 4px 30px rgba(0, 0, 0, 0.1);
    -webkit-backdrop-filter: blur(5px);
    backdrop-filter: blur(5px);
    border: 1px solid rgba(255, 255, 255, 0.3);
  }

  .card:hover {
    transform: translateY(-2px);
    background: rgba(255, 255, 255, 0.32);
    box-shadow: 0 8px 36px rgba(0, 0, 0, 0.14);
  }

  .card.is-new {
    background: rgba(214, 250, 235, 0.28);
    border-color: rgba(16, 185, 129, 0.5);
  }

  .card-top {
    display: flex;
    align-items: flex-start;
    gap: 8px;
  }

  .fav-btn {
    flex: none;
    font-size: 18px;
    line-height: 1;
    padding: 0;
    border: none;
    background: none;
    color: var(--muted);
    cursor: pointer;
    -webkit-tap-highlight-color: transparent;
  }

  .fav-btn:hover {
    color: var(--fav-color);
  }

  .fav-btn.is-fav {
    color: var(--fav-color);
  }

  .card h2 {
    margin: 0;
    font-size: 15px;
    font-weight: 600;
    line-height: 1.35;
    flex: 1;
  }

  .card h2 a {
    color: var(--text);
    text-decoration: none;
  }

  .card h2 a:hover {
    color: var(--accent);
    text-decoration: underline;
  }

  .badge {
    flex: none;
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.02em;
    text-transform: uppercase;
    color: #fff;
    background: linear-gradient(135deg, #10b981, #059669);
    border-radius: 999px;
    box-shadow: 0 2px 8px rgba(5, 150, 105, 0.35),
                inset 0 1px 0 rgba(255, 255, 255, 0.30);
    padding: 3px 8px;
  }

  .meta {
    display: flex;
    flex-direction: column;
    gap: 3px;
    font-size: 13px;
    color: var(--muted);
    margin-top: auto;
  }

  .meta .company {
    color: var(--text);
    font-weight: 500;
  }

  .empty {
    color: var(--muted);
    text-align: center;
    padding: 48px 0;
  }

  /* Browsers without backdrop-filter would show plain translucent panels,
     and the white text over them would get hard to read -> go nearly opaque. */
  @supports not ((backdrop-filter: blur(1px)) or (-webkit-backdrop-filter: blur(1px))) {
    header, .card, select { background: rgba(255, 255, 255, 0.94); }
    .card.is-new { background: rgba(230, 253, 245, 0.96); }
  }

  @media (prefers-reduced-motion: reduce) {
    .card { transition: none; }
    .card:hover { transform: none; }
  }

  @media (max-width: 560px) {
    .grid { grid-template-columns: 1fr; }
    .count { margin-left: 0; width: 100%; }
    header { position: static; }
  }
</style>
</head>
<body>

<header>
  <h1>VIE Offers</h1>
  <p class="updated" id="updated"></p>

  <div class="controls">
    <label for="company">Company</label>
    <select id="company">
      <option value="">All</option>
    </select>
    <button type="button" class="fav-toggle" id="favToggle" aria-pressed="false">★ Favorites</button>
    <span class="count" id="count"></span>
  </div>
</header>

<main class="wrap">
  <div class="grid" id="grid"></div>
  <p class="empty" id="empty" hidden>No offers available for this filter.</p>
</main>

(function () {
  "use strict";

  var grid = document.getElementById("grid");
  var empty = document.getElementById("empty");
  var countEl = document.getElementById("count");
  var select = document.getElementById("company");
  var favToggle = document.getElementById("favToggle");

  // ---------- favorites (localStorage) ----------
  var FAV_STORAGE_KEY = "vieOffersFavorites";
  var favOnly = false;

  function loadFavorites() {
    try {
      var raw = window.localStorage.getItem(FAV_STORAGE_KEY);
      var arr = raw ? JSON.parse(raw) : [];
      return new Set(Array.isArray(arr) ? arr : []);
    } catch (e) {
      return new Set();
    }
  }

  function saveFavorites(set) {
    try {
      window.localStorage.setItem(FAV_STORAGE_KEY, JSON.stringify(Array.from(set)));
    } catch (e) {
      // private browsing / storage disabled - favorites just won't persist
    }
  }

  var favorites = loadFavorites();

  // Normalise: everything the DOM touches must be a string.
  var offers = (Array.isArray(OFFERS) ? OFFERS : []).map(function (o) {
    o = o || {};
    var source = String(o.source || "");
    var id = String(o.id || "");
    return {
      company: String(o.company || ""),
      title: String(o.title || ""),
      location: String(o.location || ""),
      url: String(o.url || ""),
      date: String(o.date || ""),
      is_new: o.is_new === true,
      favKey: source + "|" + id
    };
  });

  // New offers first, then by date descending; offers without a date go last
  // within their group (BNP has none).
  offers.sort(function (a, b) {
    if (a.is_new !== b.is_new) return a.is_new ? -1 : 1;
    if (a.date === b.date) return a.company.localeCompare(b.company);
    if (!a.date) return 1;
    if (!b.date) return -1;
    return a.date < b.date ? 1 : -1;
  });

  // Company dropdown, built from the data actually present.
  var companies = [];
  offers.forEach(function (o) {
    if (o.company && companies.indexOf(o.company) === -1) companies.push(o.company);
  });
  companies.sort(function (a, b) { return a.localeCompare(b); });
  companies.forEach(function (c) {
    var opt = document.createElement("option");
    opt.value = c;
    opt.textContent = c;
    select.appendChild(opt);
  });

  // '2026-08-07' -> '7 Aug 2026'. Spelled-out month on purpose: 07/08/2026 reads
  // as 7 August to a British reader and 8 July to an American one. Built from the
  // string parts rather than new Date(iso), which would parse as UTC midnight and
  // slip to the previous day for viewers west of Greenwich.
  var MONTHS = ["Jan", "Feb", "Mar", "Apr", "May", "Jun",
                "Jul", "Aug", "Sep", "Oct", "Nov", "Dec"];

  function formatDate(iso) {
    var m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(iso);
    if (!m) return iso;
    var month = MONTHS[parseInt(m[2], 10) - 1];
    if (!month) return iso;
    return parseInt(m[3], 10) + " " + month + " " + m[1];
  }

  function metaLine(text, className) {
    var span = document.createElement("span");
    if (className) span.className = className;
    span.textContent = text;
    return span;
  }

  function buildCard(offer) {
    var card = document.createElement("article");
    card.className = offer.is_new ? "card is-new" : "card";

    var top = document.createElement("div");
    top.className = "card-top";

    var h2 = document.createElement("h2");
    if (offer.url) {
      var a = document.createElement("a");
      a.href = offer.url;
      a.target = "_blank";
      a.rel = "noopener noreferrer";
      a.textContent = "🔗 " + offer.title || "(untitled)";
      h2.appendChild(a);
    } else {
      h2.textContent = offer.title || "(untitled)";
    }
    top.appendChild(h2);

    if (offer.is_new) {
      var badge = document.createElement("span");
      badge.className = "badge";
      badge.textContent = "New";
      top.appendChild(badge);
    }

    var isFav = favorites.has(offer.favKey);
    var favBtn = document.createElement("button");
    favBtn.type = "button";
    favBtn.className = isFav ? "fav-btn is-fav" : "fav-btn";
    favBtn.textContent = isFav ? "★" : "☆";
    favBtn.setAttribute("aria-pressed", String(isFav));
    favBtn.setAttribute("aria-label",
      isFav ? "Remove from favorites" : "Add to favorites");
    favBtn.addEventListener("click", function () {
      if (favorites.has(offer.favKey)) {
        favorites.delete(offer.favKey);
      } else {
        favorites.add(offer.favKey);
      }
      saveFavorites(favorites);
      render();
    });
    top.appendChild(favBtn);

    card.appendChild(top);

    var meta = document.createElement("div");
    meta.className = "meta";
    if (offer.company) meta.appendChild(metaLine(offer.company, "company"));
    if (offer.location) meta.appendChild(metaLine(offer.location));
    if (offer.date) meta.appendChild(metaLine(formatDate(offer.date)));
    card.appendChild(meta);

    return card;
  }

  function render() {
    var filter = select.value;
    var shown = filter ? offers.filter(function (o) { return o.company === filter; })
                       : offers;
    if (favOnly) shown = shown.filter(function (o) { return favorites.has(o.favKey); });

    grid.textContent = "";
    var frag = document.createDocumentFragment();
    shown.forEach(function (o) { frag.appendChild(buildCard(o)); });
    grid.appendChild(frag);

    empty.hidden = shown.length > 0;
    empty.textContent = favOnly
      ? "No favorites yet - click ☆ on an offer to save it."
      : "No offers available for this filter.";

    favToggle.classList.toggle("is-active", favOnly);
    favToggle.setAttribute("aria-pressed", String(favOnly));
    favToggle.textContent = "★ Favorites" +
      (favorites.size ? " (" + favorites.size + ")" : "");

    var newCount = shown.filter(function (o) { return o.is_new; }).length;
    countEl.textContent = "";

    var strong = document.createElement("strong");
    strong.textContent = String(shown.length);
    countEl.appendChild(strong);
    countEl.appendChild(document.createTextNode(
      " offer" + (shown.length === 1 ? "" : "s")     // 0 takes the plural in English
    ));
    if (newCount) {
      countEl.appendChild(document.createTextNode(" · "));
      var n = document.createElement("span");
      n.className = "new-count";
      n.textContent = newCount + " new";
      countEl.appendChild(n);
    }
  }

  select.addEventListener("change", render);
  favToggle.addEventListener("click", function () {
    favOnly = !favOnly;
    render();
  });
  document.getElementById("updated").textContent =
    "Generated on " + new Date().toLocaleString("fr-FR");
  render();
})();
</script>
